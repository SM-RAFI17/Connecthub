<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectHub - Social Media</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    color: #1c1e21;
}

header {
    background: #1877f2;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
}

.container {
    max-width: 650px;
    margin: 20px auto;
    padding: 10px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px #00000012;
}

h3 {
    margin-bottom: 14px;
}

textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
}

input[type="file"] {
    width: 100%;
    margin: 12px 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14px;
    margin: 4px 2px;
}

.primary {
    background: #1877f2;
    color: white;
    width: 100%;
    font-size: 16px;
}

.primary:hover {
    background: #0866ff;
}

.post {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px #00000012;
    overflow-wrap: anywhere;
}

.post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.post-date {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

.post-text {
    white-space: pre-wrap;
    line-height: 1.5;
    margin: 12px 0;
}

.post img,
.post video {
    width: 100%;
    max-height: 450px;
    object-fit: contain;
    background: #f0f2f5;
    border-radius: 8px;
    margin: 8px 0;
}

.actions {
    display: flex;
    gap: 8px;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    padding: 10px 0;
    margin-top: 12px;
}

.actions button {
    flex: 1;
    background: #f0f2f5;
    margin: 0;
}

.actions button:hover {
    background: #e4e6eb;
}

.actions .liked {
    color: #1877f2;
    font-weight: bold;
}

.comment-list {
    margin-top: 12px;
}

.comment {
    background: #f0f2f5;
    border-radius: 10px;
    padding: 10px;
    margin: 8px 0;
    font-size: 14px;
}

.comment-form {
    display: flex;
    gap: 6px;
    margin-top: 12px;
}

.comment-form input {
    flex: 1;
    min-width: 0;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 10px;
    font-size: 14px;
}

.comment-form button {
    background: #1877f2;
    color: white;
    margin: 0;
}

.delete-btn {
    background: #ffe5e5;
    color: #d00;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #777;
}

footer {
    text-align: center;
    color: #777;
    font-size: 12px;
    padding: 20px;
}

@media (max-width: 480px) {
    .container {
        margin: 10px auto;
    }

    .card, .post {
        padding: 14px;
    }

    header {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>🌐 ConnectHub</header>

<main class="container">

    <section class="card">
        <h3>Create a Post ✍️</h3>

        <textarea
            id="postText"
            placeholder="What's on your mind?"
        ></textarea>

        <input
            type="file"
            id="mediaFile"
            accept="image/*,video/*"
        >

        <button class="primary" id="publishBtn">
            🚀 Publish Post
        </button>

        <p style="font-size:12px;color:#777;margin-top:10px">
            Share text, photos, or videos.
        </p>
    </section>

    <section id="feed"></section>

</main>

<footer>ConnectHub · Your little social world 🌍</footer>

<script>
const textInput = document.getElementById("postText");
const mediaInput = document.getElementById("mediaFile");
const publishBtn = document.getElementById("publishBtn");
const feed = document.getElementById("feed");

let posts = [];

const DB_KEY = "connecthub_posts_v1";

// Load saved posts
try {
    const saved = localStorage.getItem(DB_KEY);
    posts = saved ? JSON.parse(saved) : [];

    if (!Array.isArray(posts)) {
        posts = [];
    }
} catch (error) {
    posts = [];
}

function savePosts() {
    try {
        localStorage.setItem(DB_KEY, JSON.stringify(posts));
        return true;
    } catch (error) {
        alert(
            "Browser storage is full! Try removing some posts or using smaller media files."
        );
        return false;
    }
}

function makeElement(tag, className, text) {
    const element = document.createElement(tag);

    if (className) {
        element.className = className;
    }

    if (text !== undefined) {
        element.textContent = text;
    }

    return element;
}

// Publish a new post
publishBtn.addEventListener("click", async function () {
    const text = textInput.value.trim();
    const file = mediaInput.files[0];

    if (!text && !file) {
        alert("Write something or select a photo/video first!");
        return;
    }

    // LocalStorage is limited, so avoid huge files.
    if (file && file.size > 1.5 * 1024 * 1024) {
        alert(
            "This demo supports media files up to 1.5 MB. A real website should use cloud storage for larger files."
        );
        return;
    }

    publishBtn.disabled = true;

    try {
        let media = null;

        if (file) {
            media = {
                type: file.type.startsWith("video/")
                    ? "video"
                    : "image",
                name: file.name,
                url: await readFile(file)
            };
        }

        const post = {
            id: Date.now().toString() + Math.random(),
            text: text,
            media: media,
            likes: 0,
            liked: false,
            comments: [],
            date: new Date().toLocaleString()
        };

        posts.unshift(post);

        if (!savePosts()) {
            posts.shift();
            return;
        }

        textInput.value = "";
        mediaInput.value = "";

        renderPosts();

    } catch (error) {
        alert("Could not read this file. Please try another one.");
    } finally {
        publishBtn.disabled = false;
    }
});

function readFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}

// Render posts
function renderPosts() {
    feed.replaceChildren();

    if (posts.length === 0) {
        feed.appendChild(
            makeElement(
                "div",
                "card empty",
                "No posts yet. Be the first to share something! ✨"
            )
        );

        return;
    }

    posts.forEach(post => {
        const article = makeElement("article", "post");

        // Header
        const headerRow = makeElement("div", "post-header");
        const authorInfo = makeElement("div");

        authorInfo.appendChild(
            makeElement("strong", "", "👤 You")
        );

        authorInfo.appendChild(
            makeElement("div", "post-date", post.date)
        );

        headerRow.appendChild(authorInfo);

        const deleteButton = makeElement(
            "button",
            "delete-btn",
            "🗑️ Delete"
        );

        deleteButton.addEventListener("click", () => {
            if (!confirm("Delete this post?")) return;

            const oldPosts = posts;
            posts = posts.filter(item => item.id !== post.id);

            if (!savePosts()) {
                posts = oldPosts;
                return;
            }

            renderPosts();
        });

        headerRow.appendChild(deleteButton);
        article.appendChild(headerRow);

        // Post text
        if (post.text) {
            article.appendChild(
                makeElement("div", "post-text", post.text)
            );
        }

        // Media
        if (post.media && post.media.url) {
            let mediaElement;

            if (post.media.type === "video") {
                mediaElement = document.createElement("video");
                mediaElement.controls = true;
                mediaElement.preload = "metadata";
            } else {
                mediaElement = document.createElement("img");
                mediaElement.alt = "Uploaded photo";
                mediaElement.loading = "lazy";
            }

            mediaElement.src = post.media.url;
            article.appendChild(mediaElement);
        }

        // Reactions
        const actions = makeElement("div", "actions");

        const likeButton = makeElement(
            "button",
            post.liked ? "liked" : "",
            (post.liked ? "❤️" : "👍") +
            " Like (" + post.likes + ")"
        );

        likeButton.addEventListener("click", () => {
            post.liked = !post.liked;
            post.likes = Math.max(
                0,
                post.likes + (post.liked ? 1 : -1)
            );

            if (savePosts()) {
                renderPosts();
            }
        });

        actions.appendChild(likeButton);

        const commentCount = makeElement(
            "button",
            "",
            "💬 Comments (" + post.comments.length + ")"
        );

        commentCount.addEventListener("click", () => {
            const input = article.querySelector(".comment-form input");
            input.focus();
        });

        actions.appendChild(commentCount);
        article.appendChild(actions);

        // Comments
        const commentList = makeElement("div", "comment-list");

        post.comments.forEach(comment => {
            const commentElement = makeElement("div", "comment");

            commentElement.appendChild(
                makeElement("strong", "", "👤 " + comment.name)
            );

            commentElement.appendChild(
                makeElement("div", "", comment.text)
            );

            commentList.appendChild(commentElement);
        });

        article.appendChild(commentList);

        // Comment form
        const form = makeElement("form", "comment-form");
        const input = document.createElement("input");

        input.type = "text";
        input.placeholder = "Write a comment...";
        input.maxLength = 500;
        input.required = true;
        input.setAttribute("aria-label", "Write a comment");

        const sendButton = makeElement(
            "button",
            "",
            "Send"
        );

        sendButton.type = "submit";

        form.appendChild(input);
        form.appendChild(sendButton);

        form.addEventListener("submit", event => {
            event.preventDefault();

            const commentText = input.value.trim();

            if (!commentText) return;

            if (post.comments.length >= 100) {
                alert("This demo allows up to 100 comments per post.");
                return;
            }

            post.comments.push({
                name: "You",
                text: commentText
            });

            if (savePosts()) {
                renderPosts();
            } else {
                post.comments.pop();
            }
        });

        article.appendChild(form);
        feed.appendChild(article);
    });
}

// Initial display
renderPosts();
</script>

</body>
  </html>
